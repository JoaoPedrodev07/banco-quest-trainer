# Sobe a API completa (web + Postgres + Redis) num comando (ADR-020):
#   docker compose up --build
# É o mesmo caminho do deploy — o "funciona na minha máquina" morre aqui.
# O frontend continua fora: `npm run dev` local, deploy via nitro/Cloudflare.

services:
  web:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina no .env da raiz ou no shell}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://focobb:focobb@db:5432/focobb
      REDIS_URL: redis://redis:6379/0
      # Compose local não tem proxy TLS na frente.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: focobb
      POSTGRES_PASSWORD: focobb
      POSTGRES_DB: focobb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focobb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
